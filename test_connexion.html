<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Connexion SkillShareSC</title>
    </head>
<body>

    <h1>Test de l'API login.php</h1>
    <p>Ce test utilise l'envoi de données en **FORM-DATA** (via FormData).</p>
    
    <button onclick="sendLoginData()">Lancer le Test de Connexion</button>
    
    <pre id="responseOutput" style="background-color: #f4f4f4; padding: 15px; border: 1px solid #ccc; margin-top: 20px;">
        Résultat de la réponse JSON s'affichera ici.
    </pre>

    <script>
        // CRITIQUE : Vérifiez la casse de 'SkillshareSC' !
      const API_URL = 'http://localhost/SkillshareSC/Backend/api/index.php'; 

        function sendLoginData() {
            // Création de l'objet FormData (équivalent à un formulaire HTML standard)
            const formData = new FormData();
            
            // UTILISER LES IDENTIFIANTS DU COMPTE MANUELLEMENT CRÉÉ EN DB
            formData.append("email", "super.testeur@univ.com"); 
            formData.append("password", "password123"); 

            document.getElementById('responseOutput').textContent = 'Envoi en cours...';

            fetch(API_URL, {
                method: 'POST',
                // N'ajoutez PAS le header Content-Type, le navigateur gère FormData
                body: formData 
            })
            // Gère la réponse et l'extrait en JSON
            .then(response => response.json().then(data => ({
                status: response.status,
                body: data
            })))
            .then(result => {
                const output = document.getElementById('responseOutput');
                
                // Affiche le statut HTTP (200 si succès, 401 si échec)
                output.innerHTML = `Statut HTTP: ${result.status}\n\n`;
                
                // Affiche la réponse JSON de PHP
                output.innerHTML += `Réponse JSON:\n${JSON.stringify(result.body, null, 2)}`;
            })
            .catch(error => {
                const output = document.getElementById('responseOutput');
                output.innerHTML = `Erreur de connexion : ${error.message}. Vérifiez XAMPP ou l'URL.`;
            });
        }
    </script>
</body>
</html>
